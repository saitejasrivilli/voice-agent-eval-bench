[project]
name = "voice-agent-eval-bench"
version = "0.1.0"
description = "Voice agent evaluation benchmark suite"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "piper-tts>=1.6.0",
    "torch",
    "torchaudio",
    "numpy",
    "soundfile",
    "requests",
    "pyyaml",
    "jiwer",
    "datasets",
    "matplotlib",
    "noisereduce",
    "peft",
    "trl",
    "accelerate",
]

[tool.setuptools.packages.find]
where = ["src"]
